name: Release Dokploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to deploy, for example v1.0.0. Leave empty when running from a tag.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION || '10' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        env:
          CI: "false"
        run: pnpm build

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
            if [[ -z "${TAG}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
              TAG="${GITHUB_REF_NAME}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${TAG}" ]]; then
            echo "release_tag is required when workflow_dispatch is not run from a tag." >&2
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+(\.[0-9]+){2}([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "Tag '${TAG}' must look like vX.Y.Z." >&2
            exit 1
          fi

          git fetch origin main --depth=1
          git fetch --tags --force

          SHA="$(git rev-list -n 1 "${TAG}")"
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "Tagged commit ${SHA} is not present on origin/main." >&2
            exit 1
          fi

          git checkout --detach "${SHA}"

          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHA:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Validate image base
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GHCR_IMAGE_NAME:-}" ]]; then
            echo "GitHub Actions variable GHCR_IMAGE_NAME is required." >&2
            exit 1
          fi
          if [[ "${GHCR_IMAGE_NAME}" != "${GHCR_IMAGE_NAME,,}" ]]; then
            echo "GHCR_IMAGE_NAME must be lowercase for GHCR." >&2
            exit 1
          fi
        env:
          GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/client.Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL || '/api' }}
          tags: |
            ${{ vars.GHCR_IMAGE_NAME }}-web:${{ steps.release.outputs.release_tag }}
            ${{ vars.GHCR_IMAGE_NAME }}-web:sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.release_tag }}
          cache-from: type=gha,scope=oncarya-web
          cache-to: type=gha,mode=max,scope=oncarya-web

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/server.Dockerfile
          push: true
          tags: |
            ${{ vars.GHCR_IMAGE_NAME }}-api:${{ steps.release.outputs.release_tag }}
            ${{ vars.GHCR_IMAGE_NAME }}-api:sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.release_tag }}
          cache-from: type=gha,scope=oncarya-api
          cache-to: type=gha,mode=max,scope=oncarya-api

  deploy:
    name: Deploy Dokploy
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync compose and deploy
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
          APP_IMAGE_TAG: ${{ needs.build-and-push.outputs.release_tag }}
          APP_VERSION: ${{ needs.build-and-push.outputs.release_tag }}
          APP_COMMIT_SHA: ${{ needs.build-and-push.outputs.commit_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const required = [
            'DOKPLOY_URL',
            'DOKPLOY_API_KEY',
            'DOKPLOY_COMPOSE_ID',
            'GHCR_IMAGE_NAME',
            'APP_IMAGE_TAG',
            'APP_VERSION',
            'APP_COMMIT_SHA'
          ];

          for (const key of required) {
            if (!process.env[key]) {
              throw new Error(`${key} is required`);
            }
          }

          const baseUrl = process.env.DOKPLOY_URL.replace(/\/+$/, '');
          const composeId = process.env.DOKPLOY_COMPOSE_ID;

          const request = async (path, options = {}) => {
            const response = await fetch(`${baseUrl}${path}`, {
              ...options,
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.DOKPLOY_API_KEY,
                ...(options.headers || {})
              }
            });

            const text = await response.text();
            let payload = {};
            if (text) {
              try {
                payload = JSON.parse(text);
              } catch {
                payload = { raw: text };
              }
            }

            if (!response.ok) {
              throw new Error(`${path} failed with HTTP ${response.status}: ${JSON.stringify(payload)}`);
            }

            return payload;
          };

          const findEnv = (payload) => {
            const candidates = [
              payload.env,
              payload.compose?.env,
              payload.data?.env,
              payload.data?.compose?.env
            ];
            return candidates.find((value) => typeof value === 'string');
          };

          const upsertEnv = (envText, updates) => {
            const lines = envText.split(/\r?\n/);
            const seen = new Set();
            const next = lines.map((line) => {
              const match = line.match(/^([A-Z0-9_]+)=/);
              if (!match || !Object.prototype.hasOwnProperty.call(updates, match[1])) {
                return line;
              }
              seen.add(match[1]);
              return `${match[1]}=${updates[match[1]]}`;
            });

            for (const [key, value] of Object.entries(updates)) {
              if (!seen.has(key)) {
                next.push(`${key}=${value}`);
              }
            }

            return next.join('\n').trim() + '\n';
          };

          const current = await request(`/api/compose.one?composeId=${encodeURIComponent(composeId)}`, {
            method: 'GET'
          });
          const currentEnv = findEnv(current);

          if (typeof currentEnv !== 'string') {
            throw new Error('Could not read the existing Dokploy compose environment. Configure the compose env once in Dokploy before using release automation.');
          }

          const env = upsertEnv(currentEnv, {
            GHCR_IMAGE_NAME: process.env.GHCR_IMAGE_NAME,
            APP_IMAGE_TAG: process.env.APP_IMAGE_TAG,
            APP_VERSION: process.env.APP_VERSION,
            APP_COMMIT_SHA: process.env.APP_COMMIT_SHA
          });

          await request('/api/compose.update', {
            method: 'POST',
            body: JSON.stringify({
              composeId,
              composeFile: fs.readFileSync('docker-compose.prod.yml', 'utf8'),
              env,
              sourceType: 'raw',
              composeType: 'docker-compose'
            })
          });

          await request('/api/compose.deploy', {
            method: 'POST',
            body: JSON.stringify({
              composeId,
              title: `Oncarya ${process.env.APP_IMAGE_TAG}`,
              description: `GitHub Actions ${process.env.APP_COMMIT_SHA}`
            })
          });
          NODE

      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || vars.PUBLIC_APP_URL }}
        run: node scripts/smoke-prod.mjs "${SMOKE_BASE_URL}"
