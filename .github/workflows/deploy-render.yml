name: Deploy to Render

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  deploy-render:
    name: Deploy Render services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --depth=1

          # On tag pushes, GITHUB_SHA is the tagged commit.
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "✅ Tagged commit is present on main"
          else
            echo "❌ Tagged commit is NOT present on main; skipping deploy" >&2
            exit 1
          fi

      - name: Deploy backend (Render)
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY:-}" || -z "${SERVICE_ID:-}" ]]; then
            echo "Missing secrets: RENDER_API_KEY and/or RENDER_BACKEND_SERVICE_ID" >&2
            exit 1
          fi

          url="https://api.render.com/v1/services/${SERVICE_ID}/deploys"
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"clearCache":false}' \
            "$url")

          cat response.json
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "❌ Backend deploy request failed (HTTP $http_code)" >&2
            exit 1
          fi

      - name: Deploy frontend (Render)
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY:-}" || -z "${SERVICE_ID:-}" ]]; then
            echo "Missing secrets: RENDER_API_KEY and/or RENDER_FRONTEND_SERVICE_ID" >&2
            exit 1
          fi

          url="https://api.render.com/v1/services/${SERVICE_ID}/deploys"
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"clearCache":false}' \
            "$url")

          cat response.json
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "❌ Frontend deploy request failed (HTTP $http_code)" >&2
            exit 1
          fi
