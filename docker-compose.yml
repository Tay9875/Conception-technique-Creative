services:
  db:
    image: mysql:8.4
    container_name: oncarya-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: oncarya
      MYSQL_USER: oncarya
      MYSQL_PASSWORD: oncarya
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
